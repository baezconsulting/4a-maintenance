name: Deploy to SmarterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}

      # lftp handles IIS FTPS (SmarterASP) data connections reliably.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # 1) Upload everything in dist/ (never deletes files outside assets/, so
      #    server-side files like web.config are left alone).
      # 2) Mirror assets/ with --delete to remove old hashed JS/CSS from previous builds.
      - name: Upload dist/ via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          # Keep only hostname characters; drops pasted invisible chars (zero-width/non-breaking spaces).
          host=$(printf '%s' "$FTP_HOST" | sed -E 's#^[a-zA-Z]+://##' | LC_ALL=C tr -cd 'A-Za-z0-9.-')
          echo "::add-mask::$host"
          raw_bytes=$(printf '%s' "$FTP_HOST" | wc -c)
          echo "FTP_HOST: ${raw_bytes} bytes stored, ${#host} after cleanup"
          [ "$raw_bytes" -ne "${#host}" ] && echo "::warning::FTP_HOST contained $((raw_bytes - ${#host})) extra/invisible bytes; they were stripped. Consider retyping the secret."
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::FTP_HOST (secret or variable) does not resolve. Set it to the FTP host from the SmarterASP control panel."
            exit 1
          fi
          dir="${FTP_SERVER_DIR:-.}"
          lftp --env-password -u "$FTP_USERNAME" "$host" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --no-perms --verbose --parallel=4 --exclude-glob assets/ dist/ '$dir';
            mirror --reverse --no-perms --verbose --parallel=4 --delete dist/assets/ '$dir/assets';
            bye"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a renovated bathroom with a dark vanity and round mirror">
  <defs>
    <pattern id="subway" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#F7F5F1"/>
      <path d="M0 0H60M0 15H60M0 30H60M30 0V15M0 15V30M60 15V30" stroke="#DDD6CC" stroke-width="2"/>
    </pattern>
    <pattern id="floor" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#CFC7BB"/>
      <path d="M0 0H80V80" fill="none" stroke="#BCB2A4" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#ECE7E0"/>
  <rect y="300" width="800" height="200" fill="url(#subway)"/>
  <rect y="296" width="800" height="8" fill="#404040"/>
  <rect y="500" width="800" height="100" fill="url(#floor)"/>
  <rect y="496" width="800" height="6" fill="#B8AE9F"/>
  <!-- pendant lights -->
  <path d="M250 0V110M550 0V110" stroke="#404040" stroke-width="3"/>
  <path d="M228 110h44l-8 34h-28z M528 110h44l-8 34h-28z" fill="#404040"/>
  <circle cx="250" cy="150" r="7" fill="#F6D98E"/>
  <circle cx="550" cy="150" r="7" fill="#F6D98E"/>
  <!-- mirror -->
  <circle cx="400" cy="210" r="112" fill="#404040"/>
  <circle cx="400" cy="210" r="102" fill="#DCE8EC"/>
  <path d="M340 150l60-40M330 190l100-70" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- vanity -->
  <rect x="230" y="360" width="340" height="18" rx="4" fill="#FFFFFF"/>
  <ellipse cx="400" cy="362" rx="70" ry="10" fill="#E6E0D7"/>
  <path d="M400 362V330a14 14 0 0 1 28 0v8" fill="none" stroke="#B9B9B9" stroke-width="7" stroke-linecap="round"/>
  <rect x="240" y="378" width="320" height="110" fill="#404040"/>
  <path d="M400 378V488" stroke="#2C2C2C" stroke-width="4"/>
  <rect x="370" y="420" width="18" height="4" rx="2" fill="#B9B9B9"/>
  <rect x="412" y="420" width="18" height="4" rx="2" fill="#B9B9B9"/>
  <rect x="256" y="488" width="16" height="12" fill="#2C2C2C"/>
  <rect x="528" y="488" width="16" height="12" fill="#2C2C2C"/>
  <!-- towel ring and red towel -->
  <circle cx="660" cy="330" r="22" fill="none" stroke="#B9B9B9" stroke-width="5"/>
  <path d="M640 345h40v90a8 8 0 0 1-8 8h-24a8 8 0 0 1-8-8z" fill="#B52A2C"/>
  <path d="M640 418h40" stroke="#8F1F21" stroke-width="4"/>
  <!-- plant -->
  <rect x="112" y="430" width="56" height="70" rx="6" fill="#FFFFFF" stroke="#DDD6CC" stroke-width="3"/>
  <path d="M140 430c-30-40-40-90-10-130M140 430c10-50 40-90 70-100M140 430c-10-40-60-60-80-60" fill="none" stroke="#6F8F6B" stroke-width="8" stroke-linecap="round"/>
</svg>

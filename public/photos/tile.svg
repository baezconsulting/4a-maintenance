<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of tile being installed, with set diamond-pattern tile, spacers and a notched trowel">
  <defs>
    <pattern id="diamond" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="80" height="80" fill="#F4F1EC"/>
      <rect width="40" height="40" fill="#404040"/>
      <rect x="40" y="40" width="40" height="40" fill="#404040"/>
      <path d="M0 0H80M0 40H80M0 80H80M0 0V80M40 0V80M80 0V80" stroke="#BFB6AA" stroke-width="3"/>
    </pattern>
    <pattern id="ridges" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#C9C2B6"/>
      <path d="M0 9H18" stroke="#B3AA9C" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#ridges)"/>
  <path d="M0 0H470L330 600H0z" fill="url(#diamond)"/>
  <!-- spacers -->
  <g fill="#B52A2C">
    <path d="M500 420h24v-8h8v8h8v8h-8v8h-8v-8h-24z" transform="rotate(20 520 424)"/>
    <path d="M560 470h24v-8h8v8h8v8h-8v8h-8v-8h-24z" transform="rotate(-15 580 474)"/>
  </g>
  <!-- loose tile -->
  <g transform="rotate(-12 610 210)">
    <rect x="540" y="150" width="140" height="140" fill="#F4F1EC" stroke="#BFB6AA" stroke-width="4"/>
    <rect x="540" y="150" width="70" height="70" fill="#404040"/>
    <rect x="610" y="220" width="70" height="70" fill="#404040"/>
  </g>
  <!-- trowel -->
  <g transform="rotate(-28 640 460)">
    <path d="M560 420h200v70H560z" fill="#9E9E9E"/>
    <path d="M560 490h200" stroke="#7A7A7A" stroke-width="2"/>
    <path d="M560 490l10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14 10 14 10-14" fill="#9E9E9E"/>
    <path d="M660 420v-40" stroke="#6E6E6E" stroke-width="10"/>
    <rect x="620" y="330" width="80" height="54" rx="22" fill="#B52A2C"/>
  </g>
</svg>

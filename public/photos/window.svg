<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustration of a newly installed double window with white trim">
  <rect width="800" height="800" fill="#ECE7E0"/>
  <rect y="690" width="800" height="110" fill="#BFB4A5"/>
  <rect y="680" width="800" height="14" fill="#F7F5F1"/>
  <!-- trim -->
  <rect x="150" y="110" width="500" height="470" fill="#F7F5F1" stroke="#D6CFC5" stroke-width="4"/>
  <rect x="130" y="570" width="540" height="30" fill="#F7F5F1" stroke="#D6CFC5" stroke-width="4"/>
  <!-- view -->
  <rect x="180" y="140" width="440" height="410" fill="#CFE3EA"/>
  <circle cx="520" cy="230" r="44" fill="#F6D98E"/>
  <path d="M180 470c80-60 160-70 230-30s140 40 210-10v120H180z" fill="#A9BFA0"/>
  <path d="M180 510c100-40 200-30 290 0s110 10 150-10v50H180z" fill="#8FA886"/>
  <!-- sashes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16">
    <rect x="180" y="140" width="440" height="410"/>
    <path d="M400 140v410M180 345h440"/>
  </g>
  <g fill="#404040">
    <rect x="280" y="337" width="20" height="16" rx="3"/>
    <rect x="500" y="337" width="20" height="16" rx="3"/>
  </g>
  <path d="M220 190l60-40M230 230l90-70" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- tape measure -->
  <rect x="660" y="590" width="80" height="80" rx="18" fill="#B52A2C"/>
  <circle cx="700" cy="630" r="16" fill="#8F1F21"/>
  <path d="M660 660H560v14h100z" fill="#F6D98E"/>
  <path d="M574 660v8M590 660v8M606 660v8M622 660v8M638 660v8" stroke="#404040" stroke-width="2"/>
</svg>
